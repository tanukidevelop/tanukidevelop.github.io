<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たびぬり - ダウンロード</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.8;
      color: #333;
      background: #fafafa;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 40px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
    }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22%;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
      color: #222;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 32px;
    }
    .store-badges {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .store-badges a {
      display: inline-block;
      transition: opacity 0.2s;
    }
    .store-badges a:hover {
      opacity: 0.8;
    }
    .store-badges img {
      height: 54px;
    }
    .divider {
      margin: 28px 0;
      border: none;
      border-top: 1px solid #eee;
    }
    .footer {
      font-size: 0.8rem;
      color: #999;
    }
    .footer a {
      color: #999;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* リダイレクト中のメッセージ（JS有効時は一瞬表示） */
    .redirecting {
      display: none;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }
  </style>

  <!-- ========== 設定 ========== -->
  <script>
    // ストアURL（※公開後に実際のURLに差し替え）
    var APP_CONFIG = {
      ios: "https://apps.apple.com/app/id6761745492",
      android: "https://play.google.com/store/apps/details?id=com.tanukidevelop.tabinuri"
    };
  </script>
  <!-- ========================== -->

  <script>
    (function() {
      var ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/i.test(ua) && APP_CONFIG.ios) {
        window.location.replace(APP_CONFIG.ios);
      } else if (/Android/i.test(ua) && APP_CONFIG.android) {
        window.location.replace(APP_CONFIG.android);
      }
      // PC等はそのままランディングページを表示
    })();
  </script>
</head>
<body>
  <div class="container">
    <p class="redirecting" id="redirecting">ストアへ移動しています...</p>

    <!-- アプリアイコン（あれば） -->
    <!-- <img src="../../assets/tabinuri-icon.png" alt="たびぬり" class="app-icon"> -->

    <h1>たびぬり</h1>
    <p class="subtitle">旅して地図を塗ろう</p>

    <div class="store-badges">
      <a href="https://apps.apple.com/app/id6761745492" id="link-ios">
        <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/ja-jp"
             alt="App Storeからダウンロード">
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.tanukidevelop.tabinuri" id="link-android">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/ja_badge_web_generic.png"
             alt="Google Playで手に入れよう"
             style="height: 80px; margin: -13px 0;">
      </a>
    </div>

    <hr class="divider">

    <div class="footer">
      <a href="https://tanukidevelop.github.io">tanukidevelop</a>
      &nbsp;|&nbsp;
      <a href="../privacy-policy.html">プライバシーポリシー</a>
    </div>
  </div>
</body>
</html>
